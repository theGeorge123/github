name: Beat the Bot CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Luau tests + Rojo build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Roblox toolchain
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          path: .
          cache: false

      - name: Run pure Luau regression tests
        run: luau tests/run.luau

      - name: Syntax-check every Luau source
        shell: bash
        run: |
          tmp="$(mktemp --suffix=.luau)"
          trap 'rm -f "$tmp"' EXIT
          while IFS= read -r -d '' file; do
            echo "syntax-check: $file"
            {
              printf '%s\n' 'local function __syntax_check__()'
              cat "$file"
              printf '\n%s\n' 'end'
            } > "$tmp"
            luau "$tmp" >/dev/null
          done < <(find src tests -name '*.lua' -print0)

      - name: Build production place
        run: |
          mkdir -p build
          rojo build default.project.json -o build/BeatTheBot.rbxlx

      - name: Verify built script contents
        run: python3 scripts/verify_build.py build/BeatTheBot.rbxlx

      - name: Build Studio smoke place
        run: rojo build test.project.json -o build/BeatTheBotSmoke.rbxlx

      - name: Upload v0.4 Rojo builds
        uses: actions/upload-artifact@v4
        with:
          name: BeatTheBot-v0.4-builds
          path: |
            build/BeatTheBot.rbxlx
            build/BeatTheBotSmoke.rbxlx

      - name: Check whitespace errors
        run: git diff --check
